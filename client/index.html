<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steal a Brainrot Online</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <!-- Login Screen -->
        <div id="loginScreen" class="screen active">
            <div class="login-container">
                <h1>🧠 STEAL A BRAINROT ONLINE</h1>
                <form id="authForm">
                    <input type="text" id="username" placeholder="Username" required>
                    <input type="password" id="password" placeholder="Password" required>
                    <button type="submit" id="loginBtn">LOGIN</button>
                </form>
                <button id="toggleRegister">CREATE ACCOUNT</button>
            </div>
        </body>

        <!-- Game Screen -->
        <div id="gameScreen" class="screen">
            <div id="gameContainer"></div>
            <div class="ui">
                <div class="hud">
                    <div class="stat">💰 Money: <span id="moneyDisplay">0</span></div>
                    <div class="stat">🧬 Brainrots: <span id="brainrotCount">0</span>/<span id="slotCount">1</span></div>
                    <div class="stat">🔄 Rebirths: <span id="rebirthDisplay">0</span></div>
                </div>
                <div class="menu">
                    <button id="shopBtn">SHOP</button>
                    <button id="indexBtn">INDEX</button>
                    <button id="adminBtn">ADMIN</button>
                    <button id="logoutBtn">LOGOUT</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.socket.io/4.6.1/socket.io.prod.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="js/game.js"></script>
    <script src="js/ui.js"></script>
</body>
</html>
